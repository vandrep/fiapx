name: Validar harness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Instalar yq v4.53.3
        env:
          YQ_VERSION: v4.53.3
        run: |
          sudo curl --fail --silent --show-error --location \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            --output /usr/local/bin/yq
          sudo chmod 0755 /usr/local/bin/yq
          yq --version

      - name: Verificar dependências
        run: |
          jq --version
          git --version
          perl --version | head -n 2

      - name: Executar gates determinísticos
        run: bash scripts/validar-harness.sh check
